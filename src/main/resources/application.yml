spring:
  application:
    name: pickmeup-api
  profiles:
    active: dev
  jpa:
    # Fail fast on lazy loading outside a transaction instead of
    # silently running N+1 queries during response serialization
    open-in-view: false
  flyway:
    # Migrations are written in MySQL dialect; only the prod profile runs them.
    # Dev/test keep H2 with ddl-auto: create-drop.
    enabled: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        # CSRF mitigation for session-cookie auth; front-end must stay same-site
        same-site: lax
        http-only: true

---
# Dev profile: H2 In-Memory
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pickmeup
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Prod profile: MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3306/pickmeup?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    # No default values: fail at startup when credentials are missing,
    # instead of surfacing as an opaque connection error later
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true