spring:
  application:
    name: pickmeup-api
  profiles:
    active: dev
  jpa:
    # Fail fast on lazy loading outside a transaction instead of
    # silently running N+1 queries during response serialization
    open-in-view: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        # CSRF mitigation for session-cookie auth; front-end must stay same-site
        same-site: lax
        http-only: true

---
# Dev profile: H2 In-Memory
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:pickmeup
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# Prod profile: MySQL
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://localhost:3006/pickmeup?serverTimezone=Asia/Tokyo&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false