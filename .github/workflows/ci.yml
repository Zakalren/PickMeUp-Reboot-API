# CI: every push/PR must prove the code builds, tests pass, and the prod
# profile actually boots against a real MySQL before it lands on main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs of the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit / slice / integration tests on H2 (the dev-profile test pyramid)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle wrapper + dependencies between runs
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  # Boots the prod profile against real MySQL 8.4: Flyway migrations apply,
  # Hibernate validate passes, and the app serves traffic. This is the check
  # that would have caught the missing spring-boot-flyway module and the
  # MySQL reserved-word column — none of which H2 tests can see.
  prod-boot-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pickmeup
          MYSQL_USER: pickmeup
          MYSQL_PASSWORD: pickmeup-ci
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build boot jar
        run: ./gradlew bootJar

      - name: Boot prod profile and smoke test
        env:
          DB_USERNAME: pickmeup
          DB_PASSWORD: pickmeup-ci
        run: |
          java -jar build/libs/*-SNAPSHOT.jar --spring.profiles.active=prod &
          APP_PID=$!

          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/api/products > /dev/null; then
              echo "Prod profile is up and serving."
              kill "$APP_PID"
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2> /dev/null; then
              echo "Application process exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for the application to become healthy."
          kill "$APP_PID"
          exit 1

  # Builds the container image and publishes it to GHCR, but only after
  # both verification jobs pass and only for commits on main (PRs from
  # forks have no write token, and unmerged code should not be published).
  build-image:
    needs: [ test, prod-boot-check ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives image tags: :latest for main, plus the immutable :sha-<commit>
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
