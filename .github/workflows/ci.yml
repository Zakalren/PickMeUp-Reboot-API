# CI: every push/PR must prove the code builds, tests pass, and the prod
# profile actually boots against a real MySQL before it lands on main.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs of the same branch to save runner minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Unit / slice / integration tests on H2 (the dev-profile test pyramid)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Caches Gradle wrapper + dependencies between runs
      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build and test
        run: ./gradlew build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test

  # Boots the prod profile against real MySQL 8.4: Flyway migrations apply,
  # Hibernate validate passes, and the app serves traffic. This is the check
  # that would have caught the missing spring-boot-flyway module and the
  # MySQL reserved-word column — none of which H2 tests can see.
  prod-boot-check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pickmeup
          MYSQL_USER: pickmeup
          MYSQL_PASSWORD: pickmeup-ci
          MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build boot jar
        run: ./gradlew bootJar

      - name: Boot prod profile and smoke test
        env:
          DB_USERNAME: pickmeup
          DB_PASSWORD: pickmeup-ci
        run: |
          java -jar build/libs/*.jar --spring.profiles.active=prod &
          APP_PID=$!

          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/api/products > /dev/null; then
              echo "Prod profile is up and serving."
              kill "$APP_PID"
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2> /dev/null; then
              echo "Application process exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done

          echo "Timed out waiting for the application to become healthy."
          kill "$APP_PID"
          exit 1

  # Builds the container image per architecture on native runners (QEMU
  # emulation would make the Gradle build take 15+ minutes on arm64) and
  # publishes arch-suffixed tags. Runs only after both verification jobs
  # pass and only for commits on main (PRs from forks have no write token,
  # and unmerged code should not be published).
  build-image:
    needs: [ test, prod-boot-check ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push (per-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/zakalren/pickmeup-reboot-api:sha-${{ env.SHORT_SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  # Stitches the per-arch images into one multi-arch manifest so that
  # :latest and :sha-<commit> pull the right architecture anywhere
  # (amd64 dev machines, the arm64 OCI instance).
  merge-image:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE=ghcr.io/zakalren/pickmeup-reboot-api
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$SHORT_SHA" \
            "$IMAGE:sha-$SHORT_SHA-amd64" \
            "$IMAGE:sha-$SHORT_SHA-arm64"

  # Pulls the fresh image on the OCI instance and restarts only the app
  # service. Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
  deploy:
    needs: merge-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The compose file is versioned in the repo; sync it so config
          # changes go through review and this pipeline like code does
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml "$USER@$HOST:/opt/pickmeup/docker-compose.yml"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd /opt/pickmeup && docker compose pull app && docker compose up -d && docker image prune -f'

      - name: Smoke test through nginx
        run: |
          sleep 10
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://pickmeup.zakalren.dev/api/products || true)
            if [ "$code" = "200" ]; then
              echo "Deployment is live (HTTP $code)."
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed (last HTTP code: $code)."
          exit 1
