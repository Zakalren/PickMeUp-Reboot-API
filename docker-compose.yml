# Local MySQL for the prod profile:
#   docker compose up -d
#   DB_USERNAME=pickmeup DB_PASSWORD=pickmeup-local \
#     ./gradlew bootRun --args='--spring.profiles.active=prod'
services:
  mysql:
    image: mysql:8.4
    container_name: pickmeup-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pickmeup
      MYSQL_USER: ${DB_USERNAME:-pickmeup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-pickmeup-local}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: